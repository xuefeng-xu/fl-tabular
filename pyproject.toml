[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-tabular"
version = "1.0.0"
description = "Tabular Dataset and Federated Learning in Flower"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "flwr[simulation]==1.23.0",
    "flwr-datasets==0.5.0",
    "datasets==3.1.0",
    "torch==2.8.0",
    "numpy==2.3.4",
    "scikit-learn==1.7.1",
    "pandas==2.3.1",
    "matplotlib==3.10.7",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "fltabular.server_app:app"
clientapp = "fltabular.client_app:app"

[tool.flwr.app.config]
dataset = "adult"
preprocess = "federated"
iid = true
model = "mlp"
lr = 0.001
num-server-rounds = 100

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 30
